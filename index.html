<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ソフトスコア</title>
<style>
:root{
  --green:#2e7d46;--green-d:#1f5c33;--red:#d94848;--blue:#2b6bd9;
  --bg:#f2f5f1;--card:#fff;--ink:#22301f;--sub:#7a8677;--line:#e2e8df;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:'Hiragino Maru Gothic ProN','BIZ UDGothic',sans-serif;-webkit-user-select:none;user-select:none}
#app{max-width:560px;margin:0 auto;padding:12px 12px 90px}
h1{font-size:20px;margin:8px 0}
.card{background:var(--card);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 1px 4px rgba(0,0,0,.06)}
button{font-family:inherit;border:none;border-radius:14px;padding:14px 10px;font-size:16px;font-weight:700;
  background:#eef2ec;color:var(--ink);width:100%;cursor:pointer}
button:active{transform:scale(.97)}
button.primary{background:var(--green);color:#fff}
button.danger{background:var(--red);color:#fff}
button.blue{background:var(--blue);color:#fff}
button.ghost{background:transparent;color:var(--sub);font-weight:400;padding:8px}
button.sel{outline:3px solid var(--green)}
.row{display:flex;gap:8px}.row>*{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
input[type=text]{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:16px;font-family:inherit;background:#fff}
label{font-size:12px;color:var(--sub);display:block;margin:10px 0 4px}
.small{font-size:12px;color:var(--sub)}
.tag{display:inline-block;background:#eef2ec;border-radius:8px;padding:2px 8px;font-size:12px;margin:2px}
/* scoreboard */
.board{background:var(--green-d);color:#fff;border-radius:16px;padding:12px;margin:10px 0}
.board .teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center}
.board .g{font-size:44px;font-weight:800;line-height:1}
.board .pts{font-size:22px;font-weight:700;background:rgba(255,255,255,.15);border-radius:10px;padding:2px 10px;margin-top:4px;display:inline-block}
.board .nm{font-size:13px;opacity:.95;margin-top:6px;line-height:1.5}
.board .srv{color:#ffd76e;font-weight:700}
.board .mid{font-size:14px;opacity:.8;padding:0 8px}
.badge{background:#ffd76e;color:#5b4300;border-radius:8px;font-size:11px;font-weight:700;padding:2px 8px;display:inline-block;margin-top:6px}
/* stats */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line)}
th{color:var(--sub);font-weight:400;font-size:12px}
td.l,th.l{text-align:left}
.bar{height:8px;border-radius:4px;background:#eef2ec;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green)}
.statline{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line);font-size:14px}
.statline b{font-size:15px}
/* nav */
#nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
  display:flex;max-width:560px;margin:0 auto}
#nav button{border-radius:0;background:#fff;font-size:12px;padding:10px 4px;color:var(--sub);font-weight:700}
#nav button.on{color:var(--green)}
.mItem{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--line)}
.big{font-size:18px;font-weight:800}
.center{text-align:center}
.vs{color:var(--sub);font-size:12px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50}
.overlay .card{width:86%;max-width:420px;text-align:center}
/* ---- JSTA公式採点票（原寸再現・mm単位） ---- */
#paperOuter{margin:0 auto;overflow:visible}
.paper2{background:#fff;width:178mm;padding:3mm 5mm;transform-origin:top left;color:#000;
  box-shadow:0 2px 10px rgba(0,0,0,.18);--fB:#1c56b0;--fL:#b3c9ee;
  font-family:'Hiragino Kaku Gothic ProN','BIZ UDGothic',sans-serif}
.pTitle{text-align:center;color:var(--fB);font-weight:700;font-size:4.4mm;letter-spacing:1mm;margin:0 0 1.6mm}
.pOrg{text-align:center;color:var(--fB);font-size:3.3mm;margin-top:1.8mm}
.pT{width:-moz-fit-content;width:fit-content;border:.5mm solid var(--fB)}
.pRow{display:grid;border-bottom:.3mm solid var(--fB)}
.pT>.pRow:last-child{border-bottom:none}
.lc,.pc{display:flex;align-items:center;justify-content:center;position:relative;min-width:0;min-height:0}
.pc{cursor:pointer}
.cB{border-right:.3mm solid var(--fB)}
.cL{border-right:.15mm solid var(--fL)}
.bb{border-bottom:.15mm solid var(--fL)}
.bbD{border-bottom:.3mm solid var(--fB)}
.lb{color:var(--fB);font-size:2.5mm;white-space:nowrap}
.ed{color:#000;font-size:3.2mm;flex:1;min-width:5mm;min-height:1.2em;outline:none;text-align:center;
  -webkit-user-select:text;user-select:text}
.gmid .ed,.hc>.ed{flex:0 1 auto;min-width:4.5mm}
.mk{font-size:3.3mm;font-weight:700;line-height:1}
.ast{position:absolute;top:.1mm;right:.2mm;font-size:1.7mm;color:var(--fB);font-style:normal;line-height:1}
.gg{display:grid;grid-template-columns:repeat(13,1fr);height:100%}
.gmid{gap:.8mm}
.glab{color:var(--fB);font-size:3.4mm;white-space:nowrap;cursor:pointer}
.hc,.hcv{display:inline-flex;align-items:center;justify-content:center;min-width:4.4mm;min-height:4.4mm;line-height:1}
.hc{border:.35mm solid #000;border-radius:50%}
.hc.sm,.hcv.sm{min-width:3.4mm;min-height:3.4mm}
.srx{gap:.6mm;font-size:2.8mm;color:var(--fB);cursor:pointer}
.vtx{writing-mode:vertical-rl;text-orientation:upright;letter-spacing:.4mm}
.sideOn{border:.35mm solid #000;border-radius:50%;padding:.2mm .8mm}
@media print{
  body{background:#fff}
  #app *{visibility:hidden}
  #nav{display:none!important}
  #paperOuter,#paperOuter *{visibility:visible}
  #paperOuter{position:absolute;left:0;top:0;width:auto!important;height:auto!important;margin:0}
  .paper2{transform:none!important;box-shadow:none}
}
@page{size:A4 portrait;margin:8mm}
.stepTitle{font-size:15px;font-weight:700;margin:4px 0 8px}
.hint{font-size:12px;color:var(--sub);margin-top:6px}
</style>
</head>
<body>
<div id="app"></div>
<div id="nav"></div>
<script>
"use strict";
/* ================= data ================= */
const LS="softscore_v1";
let matches=[];
try{matches=JSON.parse(localStorage.getItem(LS)||"[]");}catch(e){matches=[];}
const save=()=>localStorage.setItem(LS,JSON.stringify(matches));
let view="home";      // home | setup | score | stats | db
let cur=null;         // current match
let statsTarget=null; // match shown in stats view
let pt={};            // current point input state
const STROKES=["サーブ","レシーブ","ストローク","ボレー","スマッシュ","その他"];
const SEQ=[[0,0],[1,0],[0,1],[1,1]]; // [team, player] serve order per game

const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);

/* ================= rules ================= */
const needGames=m=>Math.ceil(m.format/2);
function derive(m){
  const games=[0,0],recs=[];let curPts=[0,0],pig=0,finished=false,winner=null;
  const isFinal=()=>games[0]===needGames(m)-1&&games[1]===needGames(m)-1;
  for(const p of m.points){
    curPts[p.winTeam]++;pig++;
    const target=isFinal()?7:4;
    const lead=Math.abs(curPts[0]-curPts[1]);
    if((curPts[0]>=target||curPts[1]>=target)&&lead>=2){
      const w=curPts[0]>curPts[1]?0:1;
      recs.push({pts:[...curPts],winner:w});
      games[w]++;curPts=[0,0];pig=0;
      if(games[w]>=needGames(m)){finished=true;winner=w;}
    }
  }
  return{games,curPts,recs,gameIndex:recs.length,ptsInGame:pig,final:isFinal(),finished,winner};
}
function serverNow(m,d){
  if(d.final)return SEQ[(d.gameIndex+Math.floor(d.ptsInGame/2))%4];
  return SEQ[d.gameIndex%4];
}
const pName=(m,abs)=>m.teams[Math.floor(abs/2)].players[abs%2];
const deuce=d=>{const t=d.final?7:4;return d.curPts[0]>=t-1&&d.curPts[1]>=t-1;};
// ポイントをゲームごとに分割（採点表・パターン集計用）
function annotate(m){
  const out=[];let curArr=[],curPts=[0,0];const games=[0,0];
  const isFinal=()=>games[0]===needGames(m)-1&&games[1]===needGames(m)-1;
  for(const p of m.points){
    curArr.push({...p,idx:curArr.length,final:isFinal()});
    curPts[p.winTeam]++;
    const target=isFinal()?7:4;
    const lead=Math.abs(curPts[0]-curPts[1]);
    if((curPts[0]>=target||curPts[1]>=target)&&lead>=2){
      const w=curPts[0]>curPts[1]?0:1;
      out.push({pts:curArr,score:[...curPts],winner:w,final:isFinal()});
      games[w]++;curArr=[];curPts=[0,0];
    }
  }
  if(curArr.length)out.push({pts:curArr,score:[...curPts],winner:null,final:isFinal()});
  return out;
}

/* ================= stats ================= */
function calcStats(m){
  const P=[0,1,2,3].map(()=>({win:{},miss:{},df:0,first:[0,0],svc:[0,0]}));
  const T=[{svc:[0,0],rcv:[0,0]},{svc:[0,0],rcv:[0,0]}];
  for(const p of m.points){
    const sAbs=p.st*2+p.sp;
    P[sAbs].first[1]++;
    if(p.serve===1)P[sAbs].first[0]++;
    P[sAbs].svc[1]++;
    if(p.winTeam===p.st)P[sAbs].svc[0]++;
    T[p.st].svc[1]++;T[1-p.st].rcv[1]++;
    if(p.winTeam===p.st)T[p.st].svc[0]++;else T[1-p.st].rcv[0]++;
    if(p.kind==="df"){P[sAbs].df++;continue;}
    const bag=p.kind==="win"?P[p.pl].win:P[p.pl].miss;
    bag[p.stroke]=(bag[p.stroke]||0)+1;
  }
  // S1〜S4：サーバー（A/B）×コース（クロス＝ゲーム内1・3・5…本目／逆クロス＝2・4・6…本目）
  // S1=Aクロス S2=A逆クロス S3=Bクロス S4=B逆クロス。R1〜R4はそのサーブを受けた側の同じ区分
  const mk=()=>[[0,0],[0,0],[0,0],[0,0]];
  const pat=[{S:mk(),R:mk()},{S:mk(),R:mk()}];
  for(const g of annotate(m))for(const p of g.pts){
    const k=p.sp*2+(p.idx%2);
    pat[p.st].S[k][1]++;
    if(p.winTeam===p.st)pat[p.st].S[k][0]++;
    pat[1-p.st].R[k][1]++;
    if(p.winTeam!==p.st)pat[1-p.st].R[k][0]++;
  }
  return{P,T,pat};
}
const sum=o=>Object.values(o).reduce((a,b)=>a+b,0);
const pct=(a,b)=>b?Math.round(a/b*100)+"%":"–";

/* ================= views ================= */
function render(){
  const app=$("app");
  if(view==="home")app.innerHTML=vHome();
  else if(view==="setup")app.innerHTML=vSetup();
  else if(view==="score")app.innerHTML=vScore();
  else if(view==="stats")app.innerHTML=vStats(statsTarget);
  else if(view==="sheet")app.innerHTML=vSheet(statsTarget);
  else if(view==="db")app.innerHTML=vDB();
  renderNav();
}
let backView="home";
function go(v){
  if(v==="sheet")backView=view;
  view=v;window.scrollTo(0,0);render();
}

function renderNav(){
  const items=[["home","🏠 ホーム"],["db","📊 選手DB"]];
  if(cur&&!derive(cur).finished)items.splice(1,0,["score","🎾 試合中"]);
  $("nav").innerHTML=items.map(([v,l])=>
    `<button class="${view===v?'on':''}" onclick="go('${v}')">${l}</button>`).join("");
}

/* ---------- home ---------- */
function vHome(){
  const list=[...matches].reverse().map(m=>{
    const d=derive(m);
    const t=m.teams;
    return `<div class="mItem" onclick="openMatch('${m.id}')">
      <div>
        <div><b>${esc(t[0].players[0])}・${esc(t[0].players[1])}</b> <span class="vs">vs</span> <b>${esc(t[1].players[0])}・${esc(t[1].players[1])}</b></div>
        <div class="small">${esc(m.title||"")} ${m.date} ${d.finished?"":"（試合中）"}</div>
      </div>
      <div class="big">${d.games[0]}-${d.games[1]}</div>
    </div>`;
  }).join("")||`<div class="small center" style="padding:30px 0">まだ試合がありません</div>`;
  return `<h1>🎾 ソフトスコア</h1>
  <button class="primary" style="font-size:18px;padding:18px" onclick="go('setup')">＋ 新しい試合</button>
  <div class="card"><b>試合一覧</b>${list}</div>
  <div class="row">
    <button class="ghost" onclick="exportData()">データ書き出し</button>
    <button class="ghost" onclick="$('imp').click()">データ読み込み</button>
  </div>
  <input type="file" id="imp" accept=".json" style="display:none" onchange="importData(event)">`;
}
function openMatch(id){
  const m=matches.find(x=>x.id===id);if(!m)return;
  cur=m;statsTarget=m;
  if(derive(m).finished)go("stats");else{resetPt();go("score");}
}

/* ---------- setup ---------- */
function vSetup(){
  return `<h1>新しい試合</h1>
  <div class="card">
    <label>大会名・回戦（任意）</label><input type="text" id="f_title" placeholder="例：県大会 3回戦">
    <div class="row">
      <div><label>チーム1（自分側）</label><input type="text" id="f_t0" placeholder="チーム名（任意）"></div>
      <div><label>チーム2（相手側）</label><input type="text" id="f_t1" placeholder="チーム名（任意）"></div>
    </div>
    <div class="row">
      <div><label>選手A（チーム1）</label><input type="text" id="f_p0" placeholder="名前"></div>
      <div><label>選手C（チーム2）</label><input type="text" id="f_p2" placeholder="名前"></div>
    </div>
    <div class="row">
      <div><label>選手B（チーム1）</label><input type="text" id="f_p1" placeholder="名前"></div>
      <div><label>選手D（チーム2）</label><input type="text" id="f_p3" placeholder="名前"></div>
    </div>
    <label>試合形式</label>
    <div class="row">
      <button id="fmt5" class="sel" onclick="pickFmt(5)">5ゲーム制</button>
      <button id="fmt7" onclick="pickFmt(7)">7ゲーム制</button>
    </div>
    <div style="height:14px"></div>
    <button class="primary" style="font-size:18px;padding:16px" onclick="startMatch()">試合開始 ▶</button>
  </div>
  <div class="hint">サーブ順は「A→C→B→D」のゲームローテーション。ファイナルゲームは2ポイントごとに交代で自動処理されます。</div>`;
}
let fmtSel=5;
function pickFmt(n){fmtSel=n;$("fmt5").classList.toggle("sel",n===5);$("fmt7").classList.toggle("sel",n===7);}
function startMatch(){
  const v=id=>$(id).value.trim();
  const m={
    id:Date.now().toString(36),
    date:new Date().toLocaleDateString("ja-JP"),
    start:new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"}),
    title:v("f_title"),format:fmtSel,
    teams:[
      {name:v("f_t0"),players:[v("f_p0")||"選手A",v("f_p1")||"選手B"]},
      {name:v("f_t1"),players:[v("f_p2")||"選手C",v("f_p3")||"選手D"]}
    ],
    points:[]
  };
  matches.push(m);save();
  cur=m;statsTarget=m;resetPt();go("score");
}

/* ---------- scoring ---------- */
function resetPt(){pt={serve:0,pl:null,kind:null};}
function vScore(){
  if(!cur)return vHome();
  const m=cur,d=derive(m);
  if(d.finished)return vVictory(m,d);
  const[st,sp]=serverNow(m,d);
  const srvName=m.teams[st].players[sp];
  const nm=(t)=>m.teams[t].players.map((p,i)=>{
    const isSrv=t===st&&i===sp;
    return `<div class="${isSrv?'srv':''}">${isSrv?"● ":""}${esc(p)}</div>`;
  }).join("");
  const board=`<div class="board">
    <div class="teams">
      <div><div class="g">${d.games[0]}</div><div class="pts">${d.curPts[0]}</div><div class="nm">${nm(0)}</div></div>
      <div class="mid">ゲーム<br>ー<br>ポイント</div>
      <div><div class="g">${d.games[1]}</div><div class="pts">${d.curPts[1]}</div><div class="nm">${nm(1)}</div></div>
    </div>
    <div class="center">
      ${d.final?'<span class="badge">ファイナルゲーム（7点先取）</span>':""}
      ${deuce(d)?'<span class="badge">デュース</span>':""}
    </div>
  </div>`;

  let input="";
  if(pt.serve===0){
    input=`<div class="stepTitle">🎾 ${esc(srvName)} のサーブ</div>
    <div class="row">
      <button class="primary" onclick="svc(1)">1st イン</button>
      <button onclick="svc(-1)">フォルト</button>
    </div>`;
  }else if(pt.serve===-1){
    input=`<div class="stepTitle">🎾 ${esc(srvName)} のセカンドサーブ</div>
    <div class="row">
      <button class="primary" onclick="svc(2)">2nd イン</button>
      <button class="danger" onclick="commitDF()">ダブルフォルト</button>
    </div>`;
  }else if(pt.pl===null){
    const btn=(abs)=>`<button onclick="pickPl(${abs})">${esc(pName(m,abs))}</button>`;
    input=`<div class="stepTitle">ポイントを終わらせたのは？</div>
    <div class="small center">相手側（チーム2）</div>
    <div class="row">${btn(2)}${btn(3)}</div>
    <div style="height:8px"></div>
    <div class="small center">自分側（チーム1）</div>
    <div class="row">${btn(0)}${btn(1)}</div>`;
  }else if(pt.kind===null){
    input=`<div class="stepTitle">${esc(pName(m,pt.pl))} が…</div>
    <div class="row">
      <button class="primary" onclick="pickKind('win')">決めた！ ⭕</button>
      <button class="danger" onclick="pickKind('miss')">ミスった ❌</button>
    </div>
    <button class="ghost" onclick="pt.pl=null;render()">← 選手を選び直す</button>`;
  }else{
    input=`<div class="stepTitle">${esc(pName(m,pt.pl))} の${pt.kind==="win"?"決め球":"ミスの種類"}は？</div>
    <div class="grid3">${STROKES.map(s=>`<button onclick="commitRally('${s}')">${s}</button>`).join("")}</div>
    <button class="ghost" onclick="pt.kind=null;render()">← 戻る</button>`;
  }

  const gameRow=d.recs.map((r,i)=>`<span class="tag">G${i+1}: ${r.pts[0]}-${r.pts[1]}</span>`).join("");
  return `${board}
  <div class="card">${input}</div>
  <div class="row">
    <button onclick="undoPt()" ${m.points.length?"":"disabled"}>↩ 1本取り消し</button>
    <button onclick="statsTarget=cur;go('sheet')">📋 採点表</button>
    <button class="blue" onclick="statsTarget=cur;go('stats')">📊 分析</button>
  </div>
  <div class="card"><b class="small">ゲーム経過</b><div>${gameRow||'<span class="small">まだゲームが終わっていません</span>'}</div></div>`;
}
function svc(v){pt.serve=v;render();}
function pickPl(abs){pt.pl=abs;render();}
function pickKind(k){pt.kind=k;render();}
function afterPoint(m){
  const d=derive(m);
  if(d.finished&&!m.end)m.end=new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
  save();resetPt();render();
}
function commitRally(stroke){
  const m=cur,d=derive(m);
  const[st,sp]=serverNow(m,d);
  const plTeam=Math.floor(pt.pl/2);
  const winTeam=pt.kind==="win"?plTeam:1-plTeam;
  m.points.push({st,sp,serve:pt.serve,winTeam,pl:pt.pl,stroke,kind:pt.kind});
  afterPoint(m);
}
function commitDF(){
  const m=cur,d=derive(m);
  const[st,sp]=serverNow(m,d);
  m.points.push({st,sp,serve:0,winTeam:1-st,pl:st*2+sp,stroke:"サーブ",kind:"df"});
  afterPoint(m);
}
function undoPt(){
  if(cur&&cur.points.length){cur.points.pop();save();resetPt();render();}
}
function vVictory(m,d){
  const w=m.teams[d.winner];
  return `<div class="card center" style="margin-top:40px">
    <div style="font-size:40px">🏆</div>
    <h1>${esc(w.players[0])}・${esc(w.players[1])} の勝ち！</h1>
    <div class="big">${d.games[0]} - ${d.games[1]}</div>
    <div>${d.recs.map((r,i)=>`<span class="tag">G${i+1}: ${r.pts[0]}-${r.pts[1]}</span>`).join("")}</div>
    <div style="height:12px"></div>
    <button class="blue" onclick="statsTarget=cur;go('stats')">📊 試合分析を見る</button>
    <div style="height:8px"></div>
    <button class="ghost" onclick="undoPt();go('score')">↩ 最後の1本を取り消す</button>
    <button class="primary" onclick="cur=null;go('home')">ホームへ</button>
  </div>`;
}

/* ---------- match stats ---------- */
function vStats(m){
  if(!m)return vHome();
  const d=derive(m),s=calcStats(m);
  const total=m.points.length;
  const head=`<h1>📊 試合分析</h1>
  <div class="card">
    <div class="center"><b>${esc(m.teams[0].players.join("・"))}</b> <span class="vs">vs</span> <b>${esc(m.teams[1].players.join("・"))}</b></div>
    <div class="center big">${d.games[0]} - ${d.games[1]} ${d.finished?"":"（試合中）"}</div>
    <div class="center">${d.recs.map((r,i)=>`<span class="tag">G${i+1}: ${r.pts[0]}-${r.pts[1]}</span>`).join("")}</div>
    <div class="center small">総ポイント ${total}</div>
  </div>`;
  const teamCard=`<div class="card"><b>チーム成績</b>
    <table><tr><th class="l"></th><th>サーブ時<br>ポイント率</th><th>レシーブ時<br>ポイント率</th></tr>
    ${[0,1].map(t=>`<tr><td class="l">${esc(m.teams[t].players.join("・"))}</td>
      <td>${s.T[t].svc[0]}/${s.T[t].svc[1]}（${pct(s.T[t].svc[0],s.T[t].svc[1])}）</td>
      <td>${s.T[t].rcv[0]}/${s.T[t].rcv[1]}（${pct(s.T[t].rcv[0],s.T[t].rcv[1])}）</td></tr>`).join("")}
    </table></div>`;
  const cards=[0,1,2,3].map(abs=>{
    const p=s.P[abs];
    const w=sum(p.win),ms=sum(p.miss)+p.df;
    const lines=STROKES.map(st=>{
      const a=p.win[st]||0,b=p.miss[st]||0;
      if(!a&&!b)return "";
      return `<div class="statline"><span>${st}</span><span>⭕${a}　❌${b}</span></div>`;
    }).join("");
    return `<div class="card">
      <b>${esc(pName(m,abs))}</b> <span class="small">チーム${Math.floor(abs/2)+1}</span>
      <div class="statline"><span>得点（決めた本数）</span><b>${w}</b></div>
      <div class="statline"><span>失点（ミス＋DF）</span><b>${ms}</b></div>
      ${lines}
      <div class="statline"><span>ファースト確率</span><span>${p.first[0]}/${p.first[1]}（${pct(p.first[0],p.first[1])}）</span></div>
      <div class="statline"><span>ダブルフォルト</span><span>${p.df}</span></div>
      <div class="statline"><span>自分のサーブ時ポイント率</span><span>${p.svc[0]}/${p.svc[1]}（${pct(p.svc[0],p.svc[1])}）</span></div>
    </div>`;
  }).join("");
  const patCard=`<div class="card"><b>パターン別ポイント率（S1〜S4／R1〜R4）</b>
    <div class="hint">S1＝選手Ａのクロスサーブ時　S2＝Ａの逆クロス　S3＝Ｂのクロス　S4＝Ｂの逆クロス（クロス＝ゲーム内の奇数本目）。R1〜R4＝相手のそのサーブを受けた時のポイント率</div>
    <table><tr><th class="l"></th>${["S1","S2","S3","S4","R1","R2","R3","R4"].map(x=>`<th>${x}</th>`).join("")}</tr>
    ${[0,1].map(t=>{
      const cells=[...s.pat[t].S,...s.pat[t].R].map(([a,b])=>`<td>${b?`${a}/${b}<br><b>${pct(a,b)}</b>`:"–"}</td>`).join("");
      return `<tr><td class="l">${esc(m.teams[t].players.join("・"))}</td>${cells}</tr>`;
    }).join("")}
    </table></div>`;
  const back=(d.finished
    ?`<button class="ghost" onclick="go('home')">← ホームへ</button><button class="danger" onclick="delMatch('${m.id}')">この試合を削除</button>`
    :`<button class="primary" onclick="go('score')">← スコア入力に戻る</button>`)
    +`<div style="height:8px"></div><button onclick="go('sheet')">📋 採点表を見る</button>`;
  return head+teamCard+patCard+cards+back;
}

/* ---------- score sheet (JSTA公式採点票を原寸再現・手入力可) ---------- */
function shGet(m){m.sheet=m.sheet||{};m.sheet.f=m.sheet.f||{};m.sheet.c=m.sheet.c||{};return m.sheet;}
function shF(el){const m=statsTarget;if(!m)return;shGet(m).f[el.dataset.f]=el.innerText;save();}
function cycC(key,cur,n){const m=statsTarget;if(!m)return;shGet(m).c[key]=(cur+1)%n;save();render();}

function vSheet(m){
  if(!m)return vHome();
  const sh=shGet(m);
  const gs=annotate(m),d=derive(m);
  const regs=gs.filter(g=>!g.final);
  const fg=gs.find(g=>g.final)||null;
  const PT=["","○","×"];

  const ed=(key,def,fs)=>{
    const v=sh.f[key]!==undefined?sh.f[key]:(def||"");
    return `<span class="ed"${fs?` style="font-size:${fs}"`:""} contenteditable data-f="${key}" oninput="shF(this)">${esc(v)}</span>`;
  };
  const cget=(key,auto)=>sh.c[key]!==undefined?sh.c[key]:auto;
  const cw=(txt,on,sm)=>`<span class="${on?"hc":"hcv"}${sm?" sm":""}">${txt}</span>`;

  /* --- ヘッダー2行 --- */
  const mw=cget("mw",0);
  const hdr=`
  <div class="pRow" style="grid-template-columns:44.2mm 39.9mm 41.7mm 42.2mm;height:13mm">
    <div class="lc cB" style="justify-content:flex-start;padding:0 1mm;gap:1mm">
      <span class="lb">種別</span>${ed("shu","")}
      <span class="lb" style="display:inline-flex;flex-direction:column;font-size:2.2mm;cursor:pointer" onclick="cycC('mw',${mw},3)">${cw("男",mw===1,1)}${cw("女",mw===2,1)}</span>
    </div>
    <div class="lc cB" style="gap:1mm;padding:0 1mm"><span class="lb">第</span>${ed("court","")}<span class="lb">コ　ー　ト</span></div>
    <div class="lc cB" style="justify-content:flex-start;padding:0 1mm;gap:1mm"><span class="lb">正審</span>${ed("ump1","")}</div>
    <div class="lc" style="justify-content:flex-start;padding:0 1mm;gap:1mm"><span class="lb">副審</span>${ed("ump2","")}</div>
  </div>
  <div class="pRow" style="grid-template-columns:44.2mm 39.9mm 41.7mm 42.2mm;height:13mm">
    <div class="lc cB" style="gap:1mm;padding:0 1mm"><span class="lb">第</span>${ed("round","")}<span class="lb">回戦</span></div>
    <div class="cB" style="display:grid;grid-template-rows:1fr 1fr">
      <div class="lc bb" style="gap:1mm;padding:0 1mm"><span class="lb">開始</span>${ed("tS",m.start||"")}<span class="lb">分</span></div>
      <div class="lc" style="gap:1mm;padding:0 1mm"><span class="lb">終了</span>${ed("tE",m.end||"")}<span class="lb">分</span></div>
    </div>
    <div class="lc cB" style="justify-content:flex-start;padding:0 1mm;gap:1mm"><span class="lb">線審</span>${ed("ln1","")}</div>
    <div class="lc" style="justify-content:flex-start;padding:0 1mm;gap:1mm"><span class="lb">線審</span>${ed("ln2","")}</div>
  </div>`;

  /* --- プレーヤー欄 --- */
  const noCols=["4.4mm 17.7mm 13.4mm 35.2mm","4.5mm 17.6mm 13.3mm 35.3mm"];
  const noRow=(t)=>`
    <div style="display:grid;grid-template-columns:${noCols[t]};height:12.8mm" class="bbD">
      <div class="lc cB lb" style="font-size:2.2mm">No</div>
      <div class="lc cB">${ed("no"+t,"")}</div>
      <div class="lc cB lb">所属</div>
      <div class="lc">${ed("club"+t,m.teams[t].name||"")}</div>
    </div>`;
  const pRows=(t)=>{
    const sd=cget("sd"+t,0);
    return `
    <div style="display:grid;grid-template-columns:13.2mm 4.5mm 53mm;grid-template-rows:14mm 14.1mm">
      <div class="cB" style="grid-row:1/3;display:flex;flex-direction:column">
        <div class="lc" style="flex:1"><span class="lb vtx" style="font-size:2.1mm">プレーヤー</span></div>
        <div class="lc" style="border-top:.15mm solid var(--fL);padding:.3mm 0;cursor:pointer" onclick="cycC('sd${t}',${sd},2)">
          <span class="lb ${sd===1?"sideOn":""}" style="font-size:2mm">サイド</span>
        </div>
      </div>
      <div class="lc cB lb bb">A</div>
      <div class="lc bb">${ed("pA"+t,m.teams[t].players[0]||"","3.8mm")}</div>
      <div class="lc cB lb">B</div>
      <div class="lc">${ed("pB"+t,m.teams[t].players[1]||"","3.8mm")}</div>
    </div>`;
  };
  const msWin=cget("msw",d.finished&&m.points.length?d.winner:2);
  const msL=m.points.length?String(d.games[0]):"",msR=m.points.length?String(d.games[1]):"";
  const msWrap=(inner,on)=>on?`<span class="hc" style="min-width:7mm;min-height:7mm">${inner}</span>`:inner;
  const playerBlock=`
  <div class="pRow" style="grid-template-columns:70.7mm 26.6mm 70.7mm">
    <div class="cB">${noRow(0)}${pRows(0)}</div>
    <div class="lc cB" style="flex-direction:column">
      <div class="lb" style="margin-top:.8mm">（スコア）</div>
      <div class="lc" style="flex:1;gap:1.6mm">
        ${msWrap(ed("msL",msL,"5.5mm"),msWin===0)}
        <span class="glab" style="font-size:5mm" onclick="cycC('msw',${msWin},3)">－</span>
        ${msWrap(ed("msR",msR,"5.5mm"),msWin===1)}
      </div>
    </div>
    <div>${noRow(1)}${pRows(1)}</div>
  </div>`;

  /* --- ゲーム行（①〜⑧＝上下2段13マス、Ｆ＝3段） --- */
  const mkAuto=(g,t,idx)=>{const p=g&&g.pts[idx];if(!p)return 0;return p.winTeam===t?1:2;};
  const ptCell=(key,autoIdx,cls,ast)=>{
    const cur=cget(key,autoIdx);
    return `<div class="pc ${cls}" onclick="cycC('${key}',${cur},3)">${ast?'<i class="ast">＊</i>':""}<span class="mk">${PT[cur]}</span></div>`;
  };
  const srCell=(key,auto)=>{
    const cur=cget(key,auto);
    return `<div class="lc srx cB" onclick="cycC('${key}',${cur},3)">${cw("S",cur===0)}${cw("R",cur===1)}</div>`;
  };
  // 通常行の縦線：1・3マス目の後→下段のみ濃線、5・7・9・11マス目の後→濃線、他→薄線
  const brReg=(c,band)=>{
    if(c===12)return "";
    if(c===0||c===2)return band===1?"cB":"cL";
    return (c>=4&&c%2===0)?"cB":"cL";
  };
  const GAMECOLS="13.2mm 57.5mm 26.6mm 13.3mm 57.4mm";
  const midCell=(key,label,sL,sR,win)=>`
    <div class="lc cB gmid">
      ${win===0?`<span class="hc">${ed(key+"L",sL,"3.4mm")}</span>`:ed(key+"L",sL,"3.4mm")}
      <span class="glab" onclick="cycC('${key}w',${win},3)">-${label}-</span>
      ${win===1?`<span class="hc">${ed(key+"R",sR,"3.4mm")}</span>`:ed(key+"R",sR,"3.4mm")}
    </div>`;
  const gameRow=(ri)=>{
    const g=regs[ri]||null;
    const srvT=g&&g.pts.length?g.pts[0].st:null;
    const grid=(t)=>{
      let h="";
      for(let band=0;band<2;band++)
        for(let c=0;c<13;c++)
          h+=ptCell(`p${ri}_${t}_${band}_${c}`,mkAuto(g,t,band*13+c),brReg(c,band)+(band===0?" bb":""));
      return h;
    };
    const win=cget(`g${ri}w`,g&&g.winner!==null?g.winner:2);
    const sL=g&&g.pts.length?String(g.score[0]):"",sR=g&&g.pts.length?String(g.score[1]):"";
    return `<div class="pRow" style="grid-template-columns:${GAMECOLS};height:13.5mm">
      ${srCell(`sr${ri}_0`,srvT===null?2:(srvT===0?0:1))}
      <div class="gg cB" style="grid-template-rows:1fr 1fr">${grid(0)}</div>
      ${midCell(`g${ri}`,"①②③④⑤⑥⑦⑧"[ri],sL,sR,win)}
      ${srCell(`sr${ri}_1`,srvT===null?2:(srvT===1?0:1))}
      <div class="gg" style="grid-template-rows:1fr 1fr">${grid(1)}</div>
    </div>`;
  };
  // Ｆ行：縦線とアスタリスクは公式票の千鳥配置
  const brFin=(c,band,side)=>{
    if(c===12)return "";
    const tb=side===0?[0,4,8]:[2,6,10];
    const md=side===0?[2,6,10]:[0,4,8];
    if(tb.includes(c))return band===1?"cL":"cB";
    if(md.includes(c))return band===1?"cB":"cL";
    return "cL";
  };
  const astF=(c,band,side)=>{
    const tb=side===0?[0,3,4,7,8,11,12]:[1,2,5,6,9,10];
    const md=side===0?[1,2,5,6,9,10]:[0,3,4,7,8,11,12];
    return band===1?md.includes(c):tb.includes(c);
  };
  const fRow=(()=>{
    const srvT=fg&&fg.pts.length?fg.pts[0].st:null;
    const grid=(t)=>{
      let h="";
      for(let band=0;band<3;band++)
        for(let c=0;c<13;c++){
          const idx=band===1?c:(band===2?13+c:-1);
          h+=ptCell(`pF_${t}_${band}_${c}`,idx<0?0:mkAuto(fg,t,idx),brFin(c,band,t)+(band<2?" bb":""),astF(c,band,t));
        }
      return h;
    };
    const win=cget("gFw",fg&&fg.winner!==null?fg.winner:2);
    const sL=fg&&fg.pts.length?String(fg.score[0]):"",sR=fg&&fg.pts.length?String(fg.score[1]):"";
    return `<div class="pRow" style="grid-template-columns:${GAMECOLS};height:20.3mm">
      ${srCell("srF_0",srvT===null?2:(srvT===0?0:1))}
      <div class="gg cB" style="grid-template-rows:1fr 1fr 1fr">${grid(0)}</div>
      ${midCell("gF","Ⓕ",sL,sR,win)}
      ${srCell("srF_1",srvT===null?2:(srvT===1?0:1))}
      <div class="gg" style="grid-template-rows:1fr 1fr 1fr">${grid(1)}</div>
    </div>`;
  })();

  /* --- 警告・タイム欄 --- */
  const five=(blk,ab,i)=>{
    const k=`t5_${blk}_${ab}_${i}`;const cur=cget(k,0);
    return `<span class="${cur?"hc":"hcv"} sm" style="cursor:pointer" onclick="cycC('${k}',${cur},2)">5</span>`;
  };
  const timeBlk=(blk,last)=>`
    <div class="${last?"":"cB"}" style="display:flex;flex-direction:column;justify-content:center;padding:.6mm 2mm;align-items:flex-start">
      <span class="lb">タ　イ　ム</span>
      <span class="lb" style="display:inline-flex;align-items:center;gap:1mm;margin-top:.3mm">A　${five(blk,"A",0)}・${five(blk,"A",1)}</span>
      <span class="lb" style="display:inline-flex;align-items:center;gap:1mm">B　${five(blk,"B",0)}・${five(blk,"B",1)}</span>
    </div>`;
  const warnLbl=(s)=>`
    <div class="cB" style="display:grid;grid-template-rows:1fr 1fr">
      <div class="lc lb bb" style="font-size:2.1mm">（警告）</div>
      <div class="lc lb" style="font-size:1.9mm">該当事項</div>
    </div>`;
  const warnYR=(s,ch,i,last)=>{
    const k=`wn${s}_${i}`;const cur=cget(k,0);
    return `<div class="${last?"":"cB"}" style="display:flex;flex-direction:column;align-items:center;padding-top:.4mm">
      <span class="${cur?"hc":"hcv"} sm lb" style="cursor:pointer" onclick="cycC('${k}',${cur},2)">${ch}</span>
      ${ed(`wr${s}_${i}`,"","2.6mm")}
    </div>`;
  };
  const warnRow=`
  <div class="pRow" style="grid-template-columns:8.75mm 13.3mm 13.45mm 13.15mm 35.35mm 35.5mm 8.6mm 13.4mm 13.2mm 13.3mm;height:17.4mm">
    ${warnLbl(0)}${warnYR(0,"Y",0)}${warnYR(0,"Y",1)}${warnYR(0,"R",2)}
    ${timeBlk(0)}${timeBlk(1)}
    ${warnLbl(1)}${warnYR(1,"Y",0)}${warnYR(1,"Y",1)}${warnYR(1,"R",2,true)}
  </div>`;

  /* --- 勝者サイン欄 --- */
  const signRow=`
  <div class="pRow" style="grid-template-columns:13.2mm 22.3mm 13.2mm 13.3mm 13.3mm 22.05mm 13.3mm 22.2mm 13.2mm 21.95mm;height:11.5mm">
    <div class="lc cB lb" style="font-size:2.2mm">勝者サイン</div><div class="lc cB">${ed("wsign","")}</div>
    <div class="lc cB lb" style="font-size:2.2mm">勝者No.</div><div class="lc cB">${ed("wno","")}</div>
    <div class="lc cB lb">進行</div><div class="lc cB">${ed("prog","")}</div>
    <div class="lc cB lb">点検</div><div class="lc cB">${ed("insp","")}</div>
    <div class="lc cB lb">記録</div><div class="lc">${ed("rec","")}</div>
  </div>`;

  let rows="";
  for(let ri=0;ri<8;ri++)rows+=gameRow(ri);

  const PXMM=96/25.4;
  const scale=Math.min(1,(Math.min(window.innerWidth,560)-24)/(178*PXMM));
  return `<h1 class="noprint">📋 採点票</h1>
  <div class="row noprint" style="margin-bottom:8px">
    <button class="blue" onclick="window.print()">🖨 印刷（A4）</button>
    <button class="primary" onclick="go(backView)">← 戻る</button>
  </div>
  <div class="hint noprint" style="margin-bottom:8px">記録から自動記入済み。文字はタップしてそのまま入力、マス目タップで ○→×→空欄、Ｓ Ｒ・男女・サイド・警告・タイムの5はタップで丸囲み。印刷するとA4縦の公式レイアウトになるよ。</div>
  <div id="paperOuter" style="width:${Math.round(178*PXMM*scale)}px;height:${Math.round(243*PXMM*scale)}px">
    <div class="paper2" style="transform:scale(${scale})">
      <div class="pTitle">ダブルス・シングルス採点票</div>
      <div class="pT">${hdr}${playerBlock}${rows}${fRow}${warnRow}${signRow}</div>
      <div class="pOrg">公益財団法人　日本ソフトテニス連盟</div>
    </div>
  </div>`;
}
function delMatch(id){
  if(!confirm("この試合データを削除する？"))return;
  matches=matches.filter(x=>x.id!==id);save();cur=null;go("home");
}

/* ---------- player DB ---------- */
function vDB(){
  const agg={};
  for(const m of matches){
    const s=calcStats(m),d=derive(m);
    [0,1,2,3].forEach(abs=>{
      const name=pName(m,abs);if(!name)return;
      const t=Math.floor(abs/2);
      const a=agg[name]=agg[name]||{games:0,wins:0,win:0,miss:0,df:0,fi:0,ft:0,winByStroke:{}};
      a.games++;
      if(d.finished&&d.winner===t)a.wins++;
      a.win+=sum(s.P[abs].win);a.miss+=sum(s.P[abs].miss);a.df+=s.P[abs].df;
      a.fi+=s.P[abs].first[0];a.ft+=s.P[abs].first[1];
      for(const k in s.P[abs].win)a.winByStroke[k]=(a.winByStroke[k]||0)+s.P[abs].win[k];
    });
  }
  const rows=Object.entries(agg).sort((a,b)=>b[1].games-a[1].games).map(([name,a])=>{
    const fav=Object.entries(a.winByStroke).sort((x,y)=>y[1]-x[1])[0];
    return `<tr><td class="l"><b>${esc(name)}</b></td><td>${a.games}</td><td>${a.wins}</td>
      <td>${a.win}</td><td>${a.miss+a.df}</td><td>${pct(a.fi,a.ft)}</td><td>${a.df}</td>
      <td>${fav?esc(fav[0]):"–"}</td></tr>`;
  }).join("");
  return `<h1>📊 選手データベース</h1>
  <div class="card">
    <table><tr><th class="l">選手</th><th>試合</th><th>勝ち</th><th>得点</th><th>失点</th><th>1st%</th><th>DF</th><th>得意打</th></tr>
    ${rows||'<tr><td colspan="8" class="small">データなし</td></tr>'}</table>
    <div class="hint">保存された全試合から自動集計（同じ名前は同一選手として集計）</div>
  </div>`;
}

/* ---------- export / import ---------- */
function exportData(){
  const blob=new Blob([JSON.stringify(matches,null,1)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="softscore_"+new Date().toISOString().slice(0,10)+".json";
  a.click();
}
function importData(ev){
  const f=ev.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const arr=JSON.parse(rd.result);
      if(!Array.isArray(arr))throw 0;
      const ids=new Set(matches.map(m=>m.id));
      let n=0;
      for(const m of arr)if(!ids.has(m.id)){matches.push(m);n++;}
      save();alert(n+"試合を読み込んだよ");render();
    }catch(e){alert("読み込めなかった…ファイルを確認してね");}
  };
  rd.readAsText(f);
}

window.addEventListener("resize",()=>{if(view==="sheet")render();});
render();
</script>
